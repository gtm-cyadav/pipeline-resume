<!doctype html>
<!-- Source for og.png (1200x630), the link preview. Render with:  node tools/render-og.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{ font-family:Spectral; font-weight:500; src:url(../fonts/spectral-500.woff2) format("woff2"); }
  @font-face{ font-family:Spectral; font-style:italic; font-weight:500; src:url(../fonts/spectral-italic-500.woff2) format("woff2"); }
  @font-face{ font-family:Archivo; font-weight:400 700; src:url(../fonts/archivo-var.woff2) format("woff2"); }
  @font-face{ font-family:Plex; font-weight:500; src:url(../fonts/ibm-plex-mono-500.woff2) format("woff2"); }
  *{ box-sizing:border-box; margin:0; }
  html,body{ width:1200px; height:630px; }
  body{ background:#0B0F0E; color:#ECEFEC; position:relative; overflow:hidden; font-family:Archivo,sans-serif; }
  .frame{ position:absolute; inset:32px; border:1px solid rgba(236,239,236,.12); border-radius:22px; }
  .micro{ position:absolute; left:84px; top:82px; font:500 17px Plex,monospace; letter-spacing:.14em; text-transform:uppercase; color:#86918A; }
  h1{ position:absolute; left:80px; top:124px; font:500 128px/.95 Spectral,serif; letter-spacing:-.025em; }
  .role{ position:absolute; left:86px; top:392px; width:620px; font-size:27px; line-height:1.35; color:#C9A96A; }
  .line{ position:absolute; left:86px; bottom:80px; font:500 30px/1.25 Spectral,serif; color:#ECEFEC; }
  .line em{ color:#C9A96A; }
  .dial{ position:absolute; right:92px; top:110px; width:270px; text-align:center; }
  .dial svg{ width:270px; height:270px; transform:rotate(-90deg); display:block; }
  .dial b{ position:absolute; left:0; right:0; top:84px; font:500 96px/1 Spectral,serif; }
  .dial small{ position:absolute; left:0; right:0; top:192px; font:500 15px Plex,monospace; letter-spacing:.14em; color:#86918A; }
  .pill{ display:inline-block; margin-top:26px; padding:9px 18px; border:1.5px solid #DD6E4A; border-radius:999px; color:#DD6E4A; font:500 16px Plex,monospace; letter-spacing:.12em; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="micro">Inbound lead · you · scored live</div>
<h1>Chetan<br>Yadav</h1>
<div class="role">GTM and growth marketer. I build the systems behind the campaigns.</div>

<div class="dial">
  <svg viewBox="0 0 80 80" aria-hidden="true">
    <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(236,239,236,.10)" stroke-width="5"/>
    <!-- 77 / 100 of the ring -->
    <circle cx="40" cy="40" r="34" fill="none" stroke="#DD6E4A" stroke-width="5" stroke-linecap="round" stroke-dasharray="164.5 214"/>
  </svg>
  <b>77</b><small>YOUR SCORE</small>
  <div class="pill">ALERT FIRED</div>
</div>

<div class="line">You are the lead. This is my lead-scoring pipeline, <em>pointed at you.</em></div>
</body>
</html>
